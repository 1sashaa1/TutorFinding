<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" crossorigin="anonymous">
    <style>
        .error-page {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #f8f9fa;
        }
        .error-content {
            max-width: 500px;
            padding: 30px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .error-content h1 {
            font-size: 100px;
            font-weight: bold;
            color: #dc3545;
        }
        .error-content p {
            font-size: 18px;
            color: #333;
        }
        .btn-go-home {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="error-page">
    <div class="error-content">
        <h1>404</h1>
        <p>Упс! Страница не найдена. Видимо, произошла ошибка.</p>
        <a href="/" class="btn btn-primary btn-go-home">Вернуться на главную</a>
    </div>
</div>
</body>
</html>
